name: Profile README & Follower Autopilot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Latest Dev.to Articles to Profile README
        run: |
          node -e '
          import fs from "node:fs";
          const res = await fetch("https://dev.to/api/articles?username=zisamglitch&per_page=6");
          const articles = await res.json();
          if (Array.isArray(articles) && articles.length > 0) {
            const listMd = articles.map(a => `- [${a.title}](${a.url})`).join("\n");
            const readme = fs.readFileSync("README.md", "utf-8");
            const updated = readme.replace(
              /<!-- BLOG-POST-LIST:START -->[\s\S]*?<!-- BLOG-POST-LIST:END -->/,
              `<!-- BLOG-POST-LIST:START -->\n${listMd}\n<!-- BLOG-POST-LIST:END -->`
            );
            if (updated !== readme) {
              fs.writeFileSync("README.md", updated);
              console.log("Updated README with latest Dev.to articles.");
            }
          }
          '
      - name: Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): auto-sync latest engineering articles [skip ci]"
            git push
          fi
